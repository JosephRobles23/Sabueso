[project]
name = "sabueso-pdf"
version = "0.1.0"
description = "Sabueso PDF generator — Playwright headless + GCS"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.49.0",
    "google-cloud-storage>=2.19.0",
    "qrcode[pil]>=8.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]
[tool.ruff]
target-version = "py312"
line-length = 100
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
