[project]
name = "sabueso-pipeline"
version = "0.1.0"
description = "Sabueso data ingestion pipeline — CocoIndex flows (S-15)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cocoindex>=1.0.0",
    "pymupdf>=1.25.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "google-cloud-storage>=2.19.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src", "flows"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
